# Render Blueprint: one always-on web service with a persistent disk for SQLite.
# Starter plan (not free): free instances sleep, and sleeping forfeits tasks.
# Never deploy between 12:00 and 22:00 IST while a Gatekeeper round is open.
services:
  - type: web
    name: proof-gatekeeper
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /agent
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TASK_ID_ENCODING
        value: keccak
      - key: AGENT_GAMES_HMAC_SECRET
        sync: false # paste after Rotate Secret on the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false # optional: enables background Explanations
    disk:
      name: gatekeeper-data
      mountPath: /var/data
      sizeGB: 1
